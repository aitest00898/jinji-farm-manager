name: Formal Web CI

on:
  push:
    branches:
      - main
      - 'repair/**'
    paths:
      - 'web/**'
      - '.github/workflows/formal-web-ci.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/formal-web-ci.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
